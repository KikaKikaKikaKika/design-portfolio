      --border:  oklch(89%   0.005 192);
      --mono:    'DM Mono', monospace;
      --sans:    'Barlow', sans-serif;
      --display: 'Impact', 'Arial Narrow', sans-serif;
    }
    [data-theme="dark"] {
      --bg:      oklch(12%   0.008 192);
      --bg2:     oklch(17%   0.008 192);
      --bg3:     oklch(22%   0.010 192);
      --ink:     oklch(95%   0.004 192);

    @keyframes testimonialSlideRight { from { opacity: 0; transform: translateX(32px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes testimonialSlideLeft  { from { opacity: 0; transform: translateX(-32px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes ringPulse { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(2.8); opacity: 0; } }
    @keyframes cardEnter { from { transform: scale(0.91) translateY(14px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
    @keyframes cardLeaveR { from { transform: translateX(0) rotate(0deg); opacity: 1; } to { transform: translateX(115%) rotate(16deg); opacity: 0; } }
    @keyframes cardLeaveL { from { transform: translateX(0) rotate(0deg); opacity: 1; } to { transform: translateX(-115%) rotate(-16deg); opacity: 0; } }

    #tweaks-panel {

      border-radius:0; padding:20px 24px; width:260px; z-index:999;

      box-shadow:0 8px 32px oklch(0% 0 0/0.18); display:none;
    }
    #tweaks-panel.open { display:block; }
    #tweaks-panel label { opacity:.5; display:block; margin-bottom:4px; margin-top:14px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
    #tweaks-panel select { width:100%; background:oklch(24% 0.01 78); border:1px solid oklch(34% 0.01 78); color:var(--bg); border-radius:0; padding:5px 8px; font-family:var(--mono); font-size:12px; }
    .tw-title { font-size:10px; opacity:.35; letter-spacing:.1em; text-transform:uppercase; margin-bottom:14px; }
  </style>

<body>
<div id="root"></div>
<div id="tweaks-panel">
  <div class="tw-title">⚙ Tweaks</div>
  <label>Accent color</label>
  <select id="tw-accent">
    <option value="#2C22E9">Blue</option>
    <option value="oklch(65% 0.16 55)">Warm amber</option>
    <option value="oklch(60% 0.17 260)">Soft violet</option>
    <option value="oklch(58% 0.18 20)">Terracotta</option>
  </select>
  <label>Greeting</label>
  <select id="tw-greeting">
    <option value="time">Time of day</option>
    <option value="hey">Casual — Hey!</option>
    <option value="formal">Formal — Hello</option>
  </select>
  <label>Work layout</label>
  <select id="tw-layout">
    <option value="cards">Cards grid</option>
    <option value="list">Compact list</option>
  </select>
</div>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#2C22E9",
  "greeting": "time",
  "layout": "cards"
}/*EDITMODE-END*/;

const { useState, useEffect, useRef } = React;

// ── Tweaks ─────────────────────────────────────────────────────────────
function useTweaks() {
  const [t, setT] = useState(TWEAK_DEFAULTS);
  useEffect(() => {
    const handler = e => {
      if (e.data?.type === '__activate_edit_mode') document.getElementById('tweaks-panel').classList.add('open');
      else if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel').classList.remove('open');
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    const wire = () => {
      const accent = document.getElementById('tw-accent').value;
      const greeting = document.getElementById('tw-greeting').value;
      const layout = document.getElementById('tw-layout').value;
      document.documentElement.style.setProperty('--accent', accent);
      const next = { accent, greeting, layout };
      setT(next);
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
    };
    ['tw-accent','tw-greeting','tw-layout'].forEach(id => document.getElementById(id)?.addEventListener('change', wire));
    return () => window.removeEventListener('message', handler);
  }, []);
  return t;
}

function getGreeting(mode) {
  if (mode === 'hey') return 'Hey there 👋';
  if (mode === 'formal') return 'Hello';
  const h = new Date().getHours();
  if (h < 12) return 'Good morning 🌅';
  if (h < 18) return 'Good afternoon ☀️';
  return 'Good evening 🌙';
}

// ── Counter ─────────────────────────────────────────────────────────────
function Counter({ to, suffix = '' }) {
  const [v, setV] = useState(0);
  const ref = useRef(null);
  const fired = useRef(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting || fired.current) return;
      fired.current = true;
      const t0 = performance.now();
      const tick = now => {
        const p = Math.min((now - t0) / 1600, 1);
        setV(Math.round((1 - Math.pow(1 - p, 3)) * to));
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }, { threshold: 0.4 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, [to]);
  return <span ref={ref}>{v}{suffix}</span>;
}

// ── Sidebar Card Deck ────────────────────────────────────────────────────
function AvailableBadge() {
  return (
    <div style={{ display:'inline-flex', alignItems:'center', gap:8, fontFamily:'var(--mono)', fontSize:12, color:'#2C22E9', border:'1px solid rgba(44,34,233,0.45)', borderRadius:0, padding:'5px 12px' }}>
      <span className="dot-pulse" />
      <span>Available for hire</span>
    </div>
  );
}

function SidebarCardFace({ item }) {
  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column' }}>
      <div style={{ height:160, overflow:'hidden', background:'var(--bg3)', flexShrink:0 }}>
        <img src={item.img} alt="" style={{ width:'100%', height:'100%', objectFit:'cover' }} />
      </div>
      <div style={{ padding:'14px 18px 18px' }}>
        <div style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--accent)', letterSpacing:'.06em', textTransform:'uppercase', marginBottom:6, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
          {item.companies?.slice(0,2).join(' · ')}
        </div>
        <div style={{ fontSize:15, fontWeight:500, color:'var(--ink)', lineHeight:1.3, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{item.title}</div>
        <div style={{ fontSize:13, color:'var(--ink3)', marginTop:6, lineHeight:1.55, display:'-webkit-box', WebkitBoxOrient:'vertical', WebkitLineClamp:2, overflow:'hidden' }}>{item.desc}</div>
      </div>
    </div>
  );
}

function WorkCardDeck({ onOpenWork }) {
  const [active, setActive] = useState(0);
  const total = WORK.length;

  useEffect(() => {
    const id = setInterval(() => setActive(i => (i + 1) % total), 3000);
    return () => clearInterval(id);
  }, [total]);

  // Shortest circular distance from active
  const offset = (idx) => {
    let d = ((idx - active) % total + total) % total;
    if (d > total / 2) d -= total;
    return d;
  };

  // card=220px, center at tx=55 (z:3 covers sides)
  // side cards at 75% scale: visual width=165px
  // left: tx=-14 → visual 13.5–192.5, visible 13.5–55 = ~41px (25% of 165)
  // right: tx=124 → visual 151.5–316.5, visible 275–316.5 = ~41px (25% of 165)
  const tx    = (off) => { if (off === 0) return 55; if (off === -1) return -14; if (off === 1) return 124; return off < 0 ? -250 : 360; };
  const sc    = (off) => off === 0 ? 1 : 0.75;
  const rot   = (off) => off === -1 ? -4 : off === 1 ? 4 : 0;
  const zIdx  = (off) => off === 0 ? 3 : Math.abs(off) === 1 ? 2 : 1;
  const show  = (off) => Math.abs(off) <= 1;

  return (
    <div style={{ width:330, margin:'0 auto' }}>
      <div style={{ position:'relative', height:272, marginBottom:14, overflow:'hidden' }}>
        {WORK.map((item, idx) => {
          const off = offset(idx);
          const isCenter = off === 0;
          return (
            <div key={idx} style={{
              position:'absolute', left:0, top:0, bottom:0, width:220,
              borderRadius:0,
              border: isCenter ? '2px solid var(--accent)' : '1px solid var(--border)',
              background:'var(--bg)',
              overflow:'hidden',
              cursor: isCenter ? 'pointer' : 'default',
              zIndex: zIdx(off),
              transform: `translateX(${tx(off)}px) scale(${sc(off)}) rotate(${rot(off)}deg)`,
              transition: 'transform 0.55s cubic-bezier(0.34,1.4,0.64,1), box-shadow 0.2s ease',
              boxShadow: isCenter ? '0 8px 32px oklch(0% 0 0/0.16)' : 'none',
              visibility: show(off) ? 'visible' : 'hidden',
            }}
            onClick={() => isCenter && onOpenWork(item)}
            onMouseEnter={e => { if (isCenter) e.currentTarget.style.boxShadow='0 16px 48px oklch(0% 0 0/0.26)'; }}
            onMouseLeave={e => { if (isCenter) e.currentTarget.style.boxShadow='0 8px 32px oklch(0% 0 0/0.16)'; }}>
              <SidebarCardFace item={item} />
              <div style={{
                position:'absolute', inset:0,
                background:'oklch(5% 0 0/0.48)',
                opacity: isCenter ? 0 : 1,
                transition:'opacity 0.45s ease',
                pointerEvents:'none',
              }} />
            </div>
          );
        })}
      </div>

      {/* Counter + arrows */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 2px' }}>
        <button onClick={() => setActive(i => (i - 1 + total) % total)} style={{ background:'none', border:'none', color:'var(--ink3)', cursor:'pointer', padding:'2px 6px', fontSize:15, lineHeight:1, transition:'color .15s' }}
          onMouseEnter={e=>e.currentTarget.style.color='var(--ink)'}
          onMouseLeave={e=>e.currentTarget.style.color='var(--ink3)'}
        >←</button>
        <span style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--ink3)' }}>
          {String(active+1).padStart(2,'0')} / {String(total).padStart(2,'0')}
        </span>
        <button onClick={() => setActive(i => (i + 1) % total)} style={{ background:'none', border:'none', color:'var(--ink3)', cursor:'pointer', padding:'2px 6px', fontSize:15, lineHeight:1, transition:'color .15s' }}
          onMouseEnter={e=>e.currentTarget.style.color='var(--ink)'}
          onMouseLeave={e=>e.currentTarget.style.color='var(--ink3)'}
        >→</button>
      </div>
    </div>
  );
}

// ── Sidebar ──────────────────────────────────────────────────────────────
function Sidebar({ activePage, onNavigate, onOpenWork, introPlayed, theme, onToggleTheme }) {
  const [mobileOpen, setMobileOpen] = useState(false);
  const [searchOpen, setSearchOpen] = React.useState(false);
  const [searchQuery, setSearchQuery] = React.useState('');
  const [navIdx, setNavIdx] = React.useState(-1);
  const resultRefs = React.useRef([]);
  const searchInputRef = React.useRef(null);
  const searchResults = React.useMemo(() => {
    const q = searchQuery.trim().toLowerCase();
    if (q.length < 2) return [];
    return SEARCH_INDEX.filter(e => e.keywords.includes(q)).slice(0, 8);
  }, [searchQuery]);
  React.useEffect(() => { setNavIdx(-1); resultRefs.current = []; }, [searchResults.length]);
  const closeSearch = () => { setSearchOpen(false); setSearchQuery(''); setNavIdx(-1); };
  const onInputKeyDown = (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (searchResults.length > 0) { setNavIdx(0); resultRefs.current[0]?.focus(); } }
    else if (e.key === 'Escape') { closeSearch(); }
  };
  const onResultKeyDown = (e, i, r) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); const n = (i + 1) % searchResults.length; setNavIdx(n); resultRefs.current[n]?.focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (i === 0) { setNavIdx(-1); searchInputRef.current?.focus(); } else { const n = i - 1; setNavIdx(n); resultRefs.current[n]?.focus(); } }
    else if (e.key === 'Enter') { e.preventDefault(); go(r.page); closeSearch(); }
    else if (e.key === 'Escape') { closeSearch(); }
  };
  const rLogo  = React.useRef(null);
  const rTag   = React.useRef(null);
  const rDiv   = React.useRef(null);
  const rNav   = React.useRef(null);
  const rStats = React.useRef(null);

  const navItems = [
    { label: 'Home',       page: 'home' },
    { label: 'About',      page: 'about' },
    { label: 'Work',       page: 'work' },
    { label: 'Experience & Studies', page: 'experience' },
    { label: 'Leadership', page: 'leadership' },
    { label: 'Process',    page: 'process' },
    { label: 'Writing',    page: 'writing' },
    { label: 'Contact',    page: 'contact' },
  ];
  const go = (page) => { onNavigate(page); setMobileOpen(false); };

  // Hide on first mount if intro hasn't played yet
  React.useLayoutEffect(() => {
    if (introPlayed) return;
    [rLogo, rTag, rDiv, rStats].forEach(r => {
      if (r.current) r.current.style.opacity = '0';
    });
    if (rNav.current) Array.from(rNav.current.children).forEach(el => {
      el.style.opacity = '0'; el.style.transform = 'translateX(-8px)';
    });
  }, []);

  // Animate in when intro completes
  React.useEffect(() => {
    if (!introPlayed) return;
    const fade = (r, delay) => setTimeout(() => {
      if (!r.current) return;
      r.current.style.transition = 'opacity 0.4s ease';
      r.current.style.opacity = '1';
    }, delay);
    // Delays match hero-preview phase3 sequence (relative to introPlayed = t1750ms)
    // sLogo→1900, sTag→2020, sDiv→2100, sNav→2200+80i, sStats→2800
    const timers = [
      fade(rLogo,  1900),
      fade(rTag,   2020),
      fade(rDiv,   2100),
      fade(rStats, 2800),
    ];
    if (rNav.current) Array.from(rNav.current.children).forEach((el, i) => {
      timers.push(setTimeout(() => {
        el.style.transition = 'opacity 0.35s ease, transform 0.35s cubic-bezier(0.16,1,0.3,1)';
        el.style.opacity = '1'; el.style.transform = 'translateX(0)';
      }, 2200 + i * 80));
    });
    return () => timers.forEach(clearTimeout);
  }, [introPlayed]);

  return (
    <>
      <button className="hamburger-btn" onClick={() => setMobileOpen(!mobileOpen)} style={{
        display:'none', position:'fixed', top:16, left:16, zIndex:201,
        background:'var(--bg)', border:'1px solid var(--border)', borderRadius:0,
        padding:'8px 10px', cursor:'pointer', alignItems:'center', justifyContent:'center',
        transition:'background .15s',
      }}
        onMouseEnter={e => e.currentTarget.style.background='var(--bg2)'}
        onMouseLeave={e => e.currentTarget.style.background='var(--bg)'}
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      {mobileOpen && <div onClick={() => setMobileOpen(false)} style={{ position:'fixed', inset:0, background:'oklch(0% 0 0/0.3)', zIndex:99 }} />}
      <aside className={`sidebar-panel${mobileOpen ? ' open' : ''}`} style={{
        position:'fixed', left:0, top:0, bottom:0, width:240,
        background:'var(--bg)', borderRight:'1px solid var(--border)',
        display:'flex', flexDirection:'column', padding:'28px 16px 24px',
        zIndex:100, overflowY:'auto',
      }}>
        <div ref={rLogo} style={{ padding:'0 8px', marginBottom:0 }}>
          <button onClick={() => go('home')} style={{
            fontFamily:'var(--display)', fontSize:18, fontWeight:900, display:'block',
            color:'var(--ink)', background:'none', border:'none', padding:0, cursor:'pointer',
            textAlign:'left', lineHeight:1.2, transition:'color .15s', letterSpacing:'.04em',
          }}
            onMouseEnter={e => e.currentTarget.style.color='var(--ink3)'}
            onMouseLeave={e => e.currentTarget.style.color='var(--ink)'}
          >KRIST&#205;NA</button>
          <div ref={rTag} style={{ fontSize:11, color:'var(--ink3)', marginTop:4, fontFamily:'var(--mono)' }}>Design & Product Leader</div>
        </div>
        <div ref={rDiv} style={{ height:1, background:'var(--border)', margin:'20px 8px 20px' }} />
        <nav ref={rNav} style={{ flex:1 }} onKeyDown={e => {
          if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
          e.preventDefault();
          const btns = Array.from(rNav.current?.querySelectorAll('button') || []);
          const i = btns.indexOf(document.activeElement);
          if (e.key === 'ArrowDown' && i < btns.length - 1) btns[i + 1].focus();

  const img        = article ? article.img : null;
  const displayTitle = article ? article.title : (title || label);
  const category   = article ? article.category : null;
  const readTime   = article ? article.readTime : null;
  const cta        = isMedium ? 'Read on Medium →' : isDribbble ? 'View on Dribbble →' : isNilo ? 'Read on Nilo →' : 'View →';

  const PlatformBadge = () => isMedium ? (
    <div style={{ position:'absolute', top:12, right:12, width:22, height:22, borderRadius:'50%', background:'#000', display:'flex', alignItems:'center', justifyContent:'center' }}>
      <svg viewBox="0 0 24 24" width="12" height="12" fill="#fff"><path d="M13.54 12a6.8 6.8 0 01-6.77 6.82A6.8 6.8 0 010 12a6.8 6.8 0 016.77-6.82A6.8 6.8 0 0113.54 12zM20.96 12c0 3.54-1.51 6.42-3.38 6.42-1.87 0-3.39-2.88-3.39-6.42s1.52-6.42 3.39-6.42 3.38 2.88 3.38 6.42M24 12c0 3.17-.53 5.75-1.19 5.75-.66 0-1.19-2.58-1.19-5.75s.53-5.75 1.19-5.75C23.47 6.25 24 8.83 24 12z"/></svg>
    </div>
  ) : isDribbble ? (
    <div style={{ position:'absolute', top:12, right:12, width:22, height:22, borderRadius:'50%', background:'#EA4C89', display:'flex', alignItems:'center', justifyContent:'center' }}>
      <svg viewBox="0 0 24 24" width="12" height="12" fill="#fff"><path d="M12 24C5.385 24 0 18.615 0 12S5.385 0 12 0s12 5.385 12 12-5.385 12-12 12zm10.12-10.358c-.35-.11-3.17-.953-6.384-.438 1.34 3.684 1.887 6.684 1.992 7.308 2.3-1.555 3.936-4.02 4.395-6.87zm-6.115 7.808c-.153-.9-.75-4.032-2.19-7.77l-.066.02c-5.79 2.015-7.86 6.025-8.04 6.4 1.73 1.358 3.92 2.166 6.29 2.166 1.42 0 2.77-.29 4-.814zm-11.62-2.073c.232-.4 3.045-5.055 8.332-6.765.135-.045.27-.084.405-.12-.26-.585-.54-1.167-.832-1.74C7.17 11.775 2.206 11.71 1.756 11.7l-.004.312c0 2.633.998 5.037 2.634 6.855zm-2.42-8.955c.46.008 4.683.026 9.477-1.248-1.698-3.018-3.53-5.558-3.8-5.928-2.868 1.35-5.01 3.99-5.676 7.176zM9.6 2.052c.282.38 2.145 2.914 3.822 6 3.645-1.365 5.19-3.44 5.373-3.702-1.81-1.61-4.19-2.586-6.795-2.586-.825 0-1.63.1-2.4.285zm10.335 3.483c-.218.29-1.935 2.493-5.724 4.04.24.49.47.985.68 1.486.08.18.15.36.22.53 3.41-.43 6.8.26 7.14.33-.02-2.42-.88-4.64-2.31-6.386z"/></svg>
    </div>
  ) : isNilo ? (
    <img src="nilo-logo.png" alt="Nilo Studio" style={{ position:'absolute', top:12, right:12, width:22, height:22, borderRadius:'50%', objectFit:'cover', display:'block' }} />
  ) : null;

  return (
    <a href={href} target="_blank" rel="noopener"
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{
        display:'grid', gridTemplateColumns: img ? '140px 1fr' : '1fr', gap:20,
        padding:16, paddingRight: 44, borderRadius:0,
        border: hov ? '1px solid var(--ink3)' : '1px solid var(--border)',
        background: hov ? 'var(--bg2)' : 'var(--bg)',
        transition:'all .2s ease', textDecoration:'none', position:'relative',
        transform: hov ? 'translateY(-2px)' : 'none',
        boxShadow: hov ? '0 8px 24px oklch(0% 0 0/0.10)' : '0 2px 8px oklch(0% 0 0/0.04)',
      }}>
      {img && <img src={img} alt="" style={{ width:'100%', aspectRatio:'16/10', objectFit:'cover', borderRadius:0, display:'block' }} />}
      <div style={{ display:'flex', flexDirection:'column', justifyContent:'space-between' }}>
        <div>
          {category && (
            <div style={{ display:'flex', gap:8, alignItems:'center', marginBottom:8, flexWrap:'wrap' }}>
              <span style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--accent)', background:'rgba(44,34,233,0.08)', border:'1px solid rgba(44,34,233,0.2)', borderRadius:0, padding:'2px 8px', letterSpacing:'.06em' }}>{category}</span>
              {readTime && <span style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--ink3)' }}>{readTime} read</span>}
            </div>
          )}
          <div style={{ fontSize:13.5, fontWeight:500, lineHeight:1.35, color:'var(--ink)', textWrap:'pretty' }}>{displayTitle}</div>
        </div>
        <div style={{ fontFamily:'var(--mono)', fontSize:11, color:'var(--accent)', marginTop:10, opacity: hov ? 1 : 0.6, transition:'opacity .2s' }}>{cta}</div>

      <PlatformBadge />

}

// ── Project Accordion Item ───────────────────────────────────────────────
function ProjectAccordionItem({ p }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{
      border:'1px solid var(--border)', borderRadius:0,
      background: open ? 'var(--bg2)' : 'var(--bg)',
      transition:'background 0.2s ease', overflow:'hidden',
    }}>
      {/* Header */}
      <div onClick={() => setOpen(!open)} style={{ padding:'14px 18px', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'space-between', gap:16 }}>
        <div style={{ display:'flex', gap:6, alignItems:'center', flexWrap:'wrap', flex:1, minWidth:0 }}>
          {p.featured && <span style={{ fontFamily:'var(--mono)', fontSize:10, background:'var(--accent)', color:'white', borderRadius:0, padding:'2px 8px', letterSpacing:'.06em', flexShrink:0 }}>Featured</span>}
          {p.year && <span style={{ fontFamily:'var(--mono)', fontSize:10, background:'var(--bg3)', borderRadius:0, padding:'2px 8px', color:'var(--ink3)', flexShrink:0 }}>{p.year}</span>}
          {p.company && <span style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--accent)', flexShrink:0 }}>{p.company}</span>}
          <span style={{ fontSize:14, fontWeight:500, color:'var(--ink)' }}>{p.name}</span>
        </div>
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"
          style={{ flexShrink:0, transform:open?'rotate(180deg)':'rotate(0)', transition:'transform 0.22s ease', color:'var(--ink3)' }}>
          <path d="M4 6l4 4 4-4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </div>
      {/* Expanded content */}
      {open && (
        <div style={{ borderTop:'1px solid var(--border)', padding:'16px 18px 20px' }}>
          {p.tags && (
            <div style={{ display:'flex', gap:6, flexWrap:'wrap', marginBottom:12 }}>
              {p.tags.map((t,j) => <span key={j} style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--ink3)', border:'1px solid var(--border)', borderRadius:0, padding:'1px 8px' }}>{t}</span>)}
            </div>
          )}
          <p style={{ fontSize:13.5, color:'var(--ink2)', lineHeight:1.7, textWrap:'pretty' }}>{p.desc}</p>
          {p.cases && (
            <div style={{ marginTop:16, display:'flex', flexDirection:'column', gap:8 }}>
              {p.cases.map((c,k) => (
                <div key={k} style={{ display:'flex', gap:14, padding:'12px 14px', background:'var(--bg2)', borderRadius:0, border:'1px solid var(--border)' }}>
                  <div style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--ink3)', flexShrink:0, paddingTop:2, minWidth:32 }}>{c.year}</div>
                  <div>
                    <div style={{ fontSize:13, fontWeight:500, color:'var(--ink)', marginBottom:3 }}>{c.company} — {c.format}</div>
                    <div style={{ fontSize:12.5, color:'var(--ink2)', lineHeight:1.6 }}>{c.desc}</div>
                  </div>
                </div>
              ))}
            </div>
          )}
          {p.scale && <ProjectTabs scale={p.scale} pillars={p.pillars} methods={p.methods} outcomes={p.outcomes} />}
          {(p.href || p.links) && (
            <div style={{ marginTop:16, display:'flex', flexDirection:'column', gap:10 }}>
              {(p.links || [{ href: p.href, label: p.linkLabel || 'View →' }]).map((l, k) => {
                const isCard = l.href && (l.href.includes('medium.com') || l.href.includes('dribbble.com') || l.href.includes('nilostudio.net'));
                return isCard
                  ? <ExternalLinkCard key={k} href={l.href} label={l.label} title={p.name} />
                  : <a key={k} href={l.href} target="_blank" rel="noopener"
                      style={{ display:'inline-flex', alignItems:'center', gap:6, fontFamily:'var(--mono)', fontSize:12, color:'var(--accent)', borderBottom:'1px solid var(--accent)', paddingBottom:2, transition:'opacity .2s', alignSelf:'flex-start' }}
                      onMouseEnter={e=>e.currentTarget.style.opacity='.7'}
                      onMouseLeave={e=>e.currentTarget.style.opacity='1'}
                    >{l.label}</a>;
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── Work Detail Overlay ─────────────────────────────────────────────────
function WorkDetail({ item, onClose }) {
  const [openProject, setOpenProject] = useState(null);
  const [lightboxSrc, setLightboxSrc] = useState(null);
  const openProjectRef = React.useRef(null);
  const panelRef = React.useRef(null);
  openProjectRef.current = openProject;

  useEffect(() => {
    document.body.style.overflow = 'hidden';
    const fn = e => {
      if (e.key === 'Escape') {
        if (openProjectRef.current) setOpenProject(null);
        else onClose();
      }
    };
    window.addEventListener('keydown', fn);
    return () => { document.body.style.overflow = ''; window.removeEventListener('keydown', fn); };
  }, []);

  useEffect(() => {
    if (panelRef.current) panelRef.current.scrollTo({ top: 0, behavior: 'instant' });
  }, [openProject]);

  const p = openProject;
  const btnStyle = { background:'none', border:'1px solid var(--border)', borderRadius:0, padding:'6px 14px', fontFamily:'var(--mono)', fontSize:11, color:'var(--ink3)', marginBottom:32, display:'flex', alignItems:'center', gap:6, transition:'all .18s' };
  const btnHover = e => { e.currentTarget.style.borderColor='var(--ink3)'; e.currentTarget.style.color='var(--ink)'; };
  const btnLeave = e => { e.currentTarget.style.borderColor='var(--border)'; e.currentTarget.style.color='var(--ink3)'; };

  return (
    <div style={{ position:'fixed', inset:0, zIndex:200, display:'flex', alignItems:'flex-start', justifyContent:'flex-end' }}>
      {lightboxSrc && (
        <div onClick={() => setLightboxSrc(null)} style={{ position:'fixed', inset:0, zIndex:400, background:'oklch(5% 0 0 / 0.92)', display:'flex', alignItems:'center', justifyContent:'center', cursor:'zoom-out' }}>
          <img src={lightboxSrc} style={{ maxWidth:'96vw', maxHeight:'96vh', objectFit:'contain', boxShadow:'0 8px 80px oklch(0% 0 0/0.6)' }} />
        </div>
      )}
      <div onClick={onClose} style={{ position:'absolute', inset:0, background:'oklch(15% 0.012 78 / 0.45)', animation:'fadeIn 0.25s ease' }} />
      <div ref={panelRef} className="work-detail-panel" style={{ position:'relative', zIndex:1, width:'calc(100vw - 240px)', height:'100vh', background:'var(--bg)', overflowY:'auto', animation:'slideIn 0.32s cubic-bezier(0.22,1,0.36,1)', boxShadow:'-24px 0 80px oklch(0% 0 0/0.12)' }}>

        {!p ? (
          // ── Category view ──────────────────────────────────────────────
          <>
            <div style={{ height:320, overflow:'hidden', background:'var(--bg3)' }}>
              <img src={item.img} alt={item.title} style={{ width:'100%', height:'100%', objectFit:'cover' }} />
            </div>
            <div style={{ padding:'40px 48px 80px' }}>
              <button onClick={onClose} style={btnStyle} onMouseEnter={btnHover} onMouseLeave={btnLeave}>← Back</button>

              {item.tag && <div style={{ fontFamily:'var(--mono)', fontSize:10, background:'var(--accent)', color:'white', borderRadius:0, padding:'2px 8px', display:'inline-block', marginBottom:12, letterSpacing:'.06em' }}>Featured</div>}
              <h2 style={{ fontSize:36, fontWeight:300, letterSpacing:'-0.025em', marginBottom:16, lineHeight:1.1 }}>{item.title}</h2>
              <p style={{ fontSize:15, color:'var(--ink2)', lineHeight:1.8, textWrap:'pretty', marginBottom:40, whiteSpace:'pre-line' }}>{item.detail.body}</p>

              {item.detail.projects && (
                <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                  {item.detail.projects.map((proj, i) => (
                    <div key={i} onClick={() => setOpenProject(proj)}
                      style={{ padding:'16px 18px', border:'1px solid var(--border)', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'space-between', gap:16, background:'var(--bg)', transition:'background .18s' }}
                      onMouseEnter={e => e.currentTarget.style.background='var(--bg2)'}
                      onMouseLeave={e => e.currentTarget.style.background='var(--bg)'}
                    >
                      <div style={{ display:'flex', gap:8, alignItems:'center', flexWrap:'wrap', flex:1, minWidth:0 }}>
                        {proj.featured && <span style={{ fontFamily:'var(--mono)', fontSize:10, background:'var(--accent)', color:'white', borderRadius:0, padding:'2px 8px', letterSpacing:'.06em', flexShrink:0 }}>Featured</span>}
                        {proj.year && <span style={{ fontFamily:'var(--mono)', fontSize:10, background:'var(--bg3)', borderRadius:0, padding:'2px 8px', color:'var(--ink3)', flexShrink:0 }}>{proj.year}</span>}
                        {proj.company && <span style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--accent)', flexShrink:0 }}>{proj.company}</span>}
                        <span style={{ fontSize:14, fontWeight:500, color:'var(--ink)' }}>{proj.name}</span>
                        {proj.tags && proj.tags.map((t,j) => <span key={j} style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--ink3)', border:'1px solid var(--border)', borderRadius:0, padding:'1px 8px' }}>{t}</span>)}
                      </div>
                      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" style={{ flexShrink:0, color:'var(--ink3)' }}>
                        <path d="M6 4l4 4-4 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>

                  ))}
                </div>

                  <div style={{ fontFamily:'var(--mono)', fontSize:11, color:'var(--ink3)', letterSpacing:'.08em', textTransform:'uppercase', marginBottom:16 }}>Key capabilities</div>
                  {item.detail.points.map((pt, i) => (
                    <div key={i} style={{ display:'flex', gap:16, padding:'13px 0', borderBottom:'1px solid var(--border)', alignItems:'center' }}>
                      <div style={{ width:6, height:6, borderRadius:0, background:`oklch(67% 0.14 ${item.accent})`, flexShrink:0 }} />
                      <span style={{ fontSize:14, color:'var(--ink2)' }}>{pt}</span>
                    </div>
                  ))}
                </>
              )}
              {item.href && (
                <div style={{ marginTop:28 }}>
                  {(item.href.includes('medium.com') || item.href.includes('dribbble.com') || item.href.includes('nilostudio.net'))
                    ? <ExternalLinkCard href={item.href} label={item.hrefLabel || 'View →'} title={item.title} />
                    : <a href={item.href} target="_blank" rel="noopener" style={{ display:'inline-flex', alignItems:'center', gap:6, fontFamily:'var(--mono)', fontSize:12, color:'var(--accent)', borderBottom:'1px solid var(--accent)', paddingBottom:2, transition:'opacity .2s' }}
                        onMouseEnter={e=>e.currentTarget.style.opacity='.7'}
                        onMouseLeave={e=>e.currentTarget.style.opacity='1'}
                      >{item.hrefLabel || 'Read article →'}</a>
                  }
                </div>
              )}
            </div>
          </>
        ) : (
          // ── Project detail view (blog post layout) ───────────────────
          <div style={{ padding:'56px 160px 100px' }}>
            <button onClick={() => setOpenProject(null)} style={btnStyle} onMouseEnter={btnHover} onMouseLeave={btnLeave}>← {item.title}</button>

            <div style={{ display:'flex', gap:8, alignItems:'center', flexWrap:'wrap', marginBottom:20 }}>
              {p.year && <span style={{ fontFamily:'var(--mono)', fontSize:10, background:'var(--bg3)', borderRadius:0, padding:'2px 8px', color:'var(--ink3)' }}>{p.year}</span>}
              {p.company && <span style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--accent)' }}>{p.company}</span>}
              {p.tags && p.tags.map((t,j) => <span key={j} style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--ink3)', border:'1px solid var(--border)', borderRadius:0, padding:'1px 8px' }}>{t}</span>)}
            </div>

            <h2 style={{ fontSize:40, fontWeight:300, letterSpacing:'-0.03em', marginBottom:24, lineHeight:1.08 }}>{p.name}</h2>
            <p style={{ fontSize:16, color:'var(--ink2)', lineHeight:1.85, textWrap:'pretty', marginBottom:0, maxWidth:640 }}>{p.desc}</p>

            {p.meta && (
              <div style={{ display:'grid', gridTemplateColumns:'160px 1fr', marginTop:36, borderTop:'1px solid var(--border)', borderLeft:'1px solid var(--border)' }}>
                {p.meta.map((row, i) => (
                  <React.Fragment key={i}>
                    <div style={{ fontFamily:'var(--mono)', fontSize:10, letterSpacing:'.1em', textTransform:'uppercase', color:'var(--ink3)', padding:'11px 16px', borderRight:'1px solid var(--border)', borderBottom:'1px solid var(--border)', background:'var(--bg2)' }}>{row.label}</div>
                    <div style={{ fontSize:13, color:'var(--ink2)', padding:'11px 16px', borderRight:'1px solid var(--border)', borderBottom:'1px solid var(--border)' }}>
                      {row.href
                        ? <a href={row.href} target="_blank" rel="noopener" style={{ color:'var(--accent)', textDecoration:'none', borderBottom:'1px solid var(--accent)', paddingBottom:1 }}
                            onMouseEnter={e=>e.currentTarget.style.opacity='.7'} onMouseLeave={e=>e.currentTarget.style.opacity='1'}
                          >{row.value} ↗</a>
                        : row.value
                      }
                    </div>
                  </React.Fragment>
                ))}
              </div>
            )}

            {p.cases && (
              <div style={{ display:'flex', flexDirection:'column', gap:8, marginTop:32 }}>
                {p.cases.map((c,k) => (
                  <div key={k} style={{ display:'flex', gap:14, padding:'12px 14px', background:'var(--bg2)', borderRadius:0, border:'1px solid var(--border)' }}>
                    <div style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--ink3)', flexShrink:0, paddingTop:2, minWidth:32 }}>{c.year}</div>
                    <div>
                      <div style={{ fontSize:13, fontWeight:500, color:'var(--ink)', marginBottom:3 }}>{c.company} — {c.format}</div>

                    </div>
                  </div>

                            <div style={{ fontFamily:'var(--mono)', fontSize:11, color:'var(--ink3)', lineHeight:1.5 }}>{s.desc}</div>
                          </div>
                        ))}
                      </div>
                    </section>
                  )}

                  {/* Strategic pillars */}
                  {p.pillars && (
                    <section id="proj-pillars" style={{ marginTop:56 }}>
                      <div style={{ fontFamily:'var(--mono)', fontSize:10, letterSpacing:'.1em', textTransform:'uppercase', color:'var(--ink3)', marginBottom:20 }}>Strategic pillars</div>
                      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
                        {p.pillars.map((s,k) => (

                      <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
                        {p.methods.map((m,k) => (
                          <span key={k} style={{ fontFamily:'var(--mono)', fontSize:11, color:'var(--ink2)', border:'1px solid var(--border)', padding:'4px 12px' }}>{m}</span>

                      </div>
                    </section>
                  )}

                  {/* Key outcomes */}

                  const elRect = el.getBoundingClientRect();
                  panelRef.current.scrollBy({ top: elRect.top - panelRect.top - 72, behavior:'smooth' });

                      <button key={s.id} onClick={() => scrollTo(`cs-${s.id}`)} style={{
                        fontFamily:'var(--mono)', fontSize:10, letterSpacing:'.08em', textTransform:'uppercase',
                        padding:'8px 14px', background:'var(--bg2)', border:'1px solid var(--border)', cursor:'pointer',
                        color:'var(--ink2)', transition:'all .15s', display:'flex', alignItems:'center', gap:6,
                      }}

                        </svg>

                  </div>

                  {p.sections.map(s => (
                    <section key={s.id} id={`cs-${s.id}`} style={{ marginTop:64, paddingTop:32, borderTop:'1px solid var(--border)' }}>
                      <div style={secLabelStyle}>{s.label}</div>
                      <h3 style={{ fontSize:28, fontWeight:300, letterSpacing:'-0.02em', lineHeight:1.15, marginBottom:20 }}>{s.title}</h3>

                                <img src={para.img} alt={para.alt || ''} style={{ width:'100%', display:'block' }} />

                          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10, marginTop:28 }}>

                              <div key={k} style={{ background:'var(--bg2)', border:'1px solid var(--border)', padding:'22px 20px' }}>
                                <div style={{ fontFamily:'var(--mono)', fontSize:11, color:'var(--ink3)', marginBottom:10 }}>{vc.num}</div>
                                <div style={{ fontSize:13, fontWeight:600, color:'var(--ink)', marginBottom:8 }}>{vc.title}</div>
                                <div style={{ fontSize:12.5, color:'var(--ink2)', lineHeight:1.65, marginBottom:14 }}>{vc.body}</div>

                      {s.photos && (
                        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10, marginTop:28 }}>

                            <img key={k} src={ph.src} alt={ph.alt} style={{ width:'100%', aspectRatio:'1/1', objectFit:'cover', display:'block' }} />

                        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginTop:12 }}>

                            <div style={{ background:'var(--bg2)', border:'1px solid var(--border)', padding:'20px 20px' }}>

                            <div style={{ background:'var(--bg2)', border:'1px solid var(--border)', padding:'20px 20px' }}>
                              <div style={{ ...secLabelStyle, opacity:.5 }}>Avoid</div>

                            </div>
                          )}
                        </div>
                      )}


                      {/* Note / callout */}
                      {s.note && (
                        <div style={{ marginTop:20, padding:'16px 20px', borderLeft:'3px solid var(--accent)', background:'var(--bg2)' }}>

                        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginTop:28 }}>

                            </div>

                      {/* Process steps */}
                      {s.processSteps && (
                        <div style={{ display:'flex', flexDirection:'column', gap:0, marginTop:28, border:'1px solid var(--border)' }}>
                          {s.processSteps.map((step, k) => (
                            <div key={k} style={{ display:'grid', gridTemplateColumns:'80px 1fr', borderBottom: k < s.processSteps.length - 1 ? '1px solid var(--border)' : 'none' }}>
                              <div style={{ fontFamily:'var(--mono)', fontSize:20, fontWeight:300, color:'var(--ink3)', padding:'24px 20px', borderRight:'1px solid var(--border)', display:'flex', alignItems:'flex-start', letterSpacing:'-0.02em' }}>{step.step}</div>
                              <div style={{ padding:'24px 28px' }}>
                                <div style={{ fontSize:14, fontWeight:600, color:'var(--ink)', marginBottom:4 }}>{step.title}</div>
                                <div style={{ fontFamily:'var(--mono)', fontSize:10, letterSpacing:'.08em', textTransform:'uppercase', color:'var(--ink3)', marginBottom:12 }}>{step.subtitle}</div>
                                <div style={{ fontSize:13.5, color:'var(--ink2)', lineHeight:1.75 }}>{step.body}</div>
                                {step.subItems && (
                                  <div style={{ marginTop:16, display:'flex', flexDirection:'column', gap:0, borderTop:'1px solid var(--border)' }}>
                                    {step.subItems.map((sub, si) => (
                                      <div key={si} style={{ display:'grid', gridTemplateColumns:'140px 1fr', borderBottom: si < step.subItems.length - 1 ? '1px solid var(--border)' : 'none', padding:'10px 0' }}>

                                        <div style={{ fontSize:12.5, color:'var(--ink2)', lineHeight:1.65 }}>{sub.desc}</div>
                                      </div>
                                    ))}
                                  </div>
                                )}
                                {step.imgSrc && (
                                  <div style={{ marginTop:16, border:'1px solid var(--border)', overflow:'hidden' }}>
                                    <img src={step.imgSrc} alt={step.imgAlt || ''} style={{ width:'100%', display:'block' }} />
                                  </div>
                                )}
                              </div>
                            </div>
                          ))}
                        </div>
                      )}

                      {/* Section image */}
                      {s.imgSrc && (
                        <div style={{ marginTop:28 }}>
                          <div style={{ border:'1px solid var(--border)', overflow:'hidden', position:'relative', cursor: s.imgExpandable ? 'zoom-in' : 'default' }}

                            <img src={s.imgSrc} alt={s.imgAlt || ''} style={{ width:'100%', display:'block' }} />
                            {s.imgExpandable && (
                              <div style={{ position:'absolute', bottom:10, right:10, background:'var(--bg)', border:'1px solid var(--border)', padding:'4px 10px', fontFamily:'var(--mono)', fontSize:9, letterSpacing:'.08em', textTransform:'uppercase', color:'var(--ink3)' }}>Click to expand</div>
                            )}
                          </div>
                          {s.imgCaption && (
                            <p style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--ink3)', marginTop:10, lineHeight:1.6, letterSpacing:'.03em' }}>{s.imgCaption}</p>
                          )}
                        </div>
                      )}

                      {/* Video demo */}
                      {s.videoSrc && (
                        <div style={{ marginTop:28, border:'1px solid var(--border)', overflow:'hidden' }}>
                          <video autoPlay muted loop playsInline style={{ width:'100%', display:'block' }}>
                            <source src={s.videoSrc} type="video/mp4" />
                          </video>
                        </div>
                      )}
                    </section>
                  ))}
                </>
              );
            })()}

            {(p.href || p.links) && (
              <div style={{ marginTop:56, display:'flex', flexDirection:'column', gap:10 }}>
                {(p.links || [{ href: p.href, label: p.linkLabel || 'View →' }]).map((l, k) => {
                  const isCard = l.href && (l.href.includes('medium.com') || l.href.includes('dribbble.com') || l.href.includes('nilostudio.net'));
                  return isCard
                    ? <ExternalLinkCard key={k} href={l.href} label={l.label} title={p.name} />
                    : <a key={k} href={l.href} target="_blank" rel="noopener"
                        style={{ display:'inline-flex', alignItems:'center', gap:6, fontFamily:'var(--mono)', fontSize:12, color:'var(--accent)', borderBottom:'1px solid var(--accent)', paddingBottom:2, transition:'opacity .2s', alignSelf:'flex-start' }}
                        onMouseEnter={e=>e.currentTarget.style.opacity='.7'}
                        onMouseLeave={e=>e.currentTarget.style.opacity='1'}
                      >{l.label}</a>;
                })}
              </div>
            )}
          </div>
        )}

      </div>
    </div>
  );
}

// ── Work Card ───────────────────────────────────────────────────────────
function WorkCard({ item, onOpen, onHover, onLeave }) {
  const [hov, setHov] = useState(false);
  return (
    <div onClick={() => onOpen(item)}
      onMouseEnter={()=>{ setHov(true); onHover && onHover(); }} onMouseLeave={()=>{ setHov(false); onLeave && onLeave(); }}
      style={{
        border:'1px solid var(--border)', borderRadius:0, overflow:'hidden',
        background: hov ? 'var(--bg2)' : 'var(--bg)',
        transform: hov ? 'translateY(-3px)' : 'none',
        boxShadow: hov ? '0 12px 40px oklch(0% 0 0/0.07)' : 'none',
        transition:'all 0.25s ease', cursor:'pointer',
        display:'flex', flexDirection:'column', height:'100%',
      }}>
      <div style={{ overflow:'hidden', height:210, background:'var(--bg3)' }}>
        <img src={item.img} alt={item.title} style={{ width:'100%', height:'100%', objectFit:'cover', transition:'transform .4s ease', transform: hov ? 'scale(1.04)' : 'scale(1)' }} />
      </div>
      <div style={{ padding:'22px 26px', flex:1, display:'flex', flexDirection:'column' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
          <div>
            {item.tag && <div style={{ fontFamily:'var(--mono)', fontSize:10, background:'var(--accent)', color:'white', borderRadius:0, padding:'2px 8px', display:'inline-block', marginBottom:8, letterSpacing:'.06em' }}>Featured</div>}
            <h3 style={{ fontSize:18, fontWeight:600 }}>{item.title}</h3>
          </div>
          <div style={{ width:9, height:9, borderRadius:0, flexShrink:0, marginTop:5, background:`oklch(67% 0.14 ${item.accent})`, opacity: hov?1:.3, transition:'opacity .2s' }} />
        </div>
        <p style={{ marginTop:8, fontSize:13, color:'var(--ink2)', lineHeight:1.65, textWrap:'pretty' }}>{item.desc}</p>
        <div style={{ marginTop:14, fontFamily:'var(--mono)', fontSize:12, color:'var(--accent)', opacity: hov?1:0, transition:'opacity .2s' }}>
          Peek inside →
        </div>
      </div>
    </div>
  );
}

// ── ScrollToTop ──────────────────────────────────────────────────────────
function ScrollToTop() {
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    const onScroll = () => setVisible(window.scrollY > 300);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <button
      onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
      style={{
        position: 'fixed', bottom: 32, right: 32,
        width: 44, height: 44, borderRadius:0,
        background: 'var(--ink)', color: 'var(--bg)',
        border: 'none', cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        opacity: visible ? 1 : 0,
        pointerEvents: visible ? 'auto' : 'none',
        transition: 'opacity .25s, transform .15s ease',
        zIndex: 999,
      }}
      onMouseEnter={e => e.currentTarget.style.transform='scale(1.1)'}
      onMouseLeave={e => e.currentTarget.style.transform='scale(1)'}
      aria-label="Back to top"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="18 15 12 9 6 15"/>
      </svg>
    </button>
  );
}

      iconSize: [7, 7], iconAnchor: [3.5, 3.5],
    });
    const size = highlighted ? 10 : 8;
    const half = size / 2;
    return L.divIcon({
      className: '',
      html: `<div style="position:relative;width:${size}px;height:${size}px;">` +
            `<div style="position:absolute;inset:0;border-radius:50%;border:2px solid #2C22E9;animation:ringPulse ${highlighted ? '1.8' : '2.4'}s ease-out infinite;"></div>` +
            `<div style="width:${size}px;height:${size}px;border-radius:50%;background:#2C22E9;position:relative;z-index:1;"></div>` +
            `</div>`,
      iconSize: [size, size], iconAnchor: [half, half],
    });
  };

  React.useEffect(() => {
    if (mapRef.current || !containerRef.current) return;
    const map = L.map(containerRef.current, {
      center: [38, -12], zoom: 2,
      zoomControl: false, scrollWheelZoom: false,
      attributionControl: false, dragging: true,
    });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors',
    }).addTo(map);
    mapRef.current = map;
  }, []);

  React.useEffect(() => {
    if (!mapRef.current) return;
    markersRef.current.forEach(m => m.remove());
    markersRef.current = [];
    const showAll    = !filteredExp || filteredExp.some(e => e.worldwide);
    const visibleKeys = showAll ? null : new Set(filteredExp.flatMap(e => e.locs || []));
    const toShow     = showAll ? ALL_MAP_LOCATIONS : ALL_MAP_LOCATIONS.filter(l => visibleKeys.has(l.key));
    const hasHighlight = highlightLocs && highlightLocs.length > 0;
    toShow.forEach(loc => {
      const isHighlighted = hasHighlight && highlightLocs.includes(loc.key);
      const isDimmed      = hasHighlight && !isHighlighted;
      const m = L.marker(loc.coords, { icon: makeIcon(isHighlighted, isDimmed) })
        .addTo(mapRef.current)
        .bindTooltip(loc.name, { permanent: isHighlighted || !hasHighlight, direction:'top', offset:[0, isHighlighted ? -9 : -8], className:'map-tooltip' })
        .openTooltip();
      markersRef.current.push(m);
    });
  }, [filteredExp, highlightLocs]);

  return (
    <div style={{ position:'relative', width:'100%', height:'100%', minHeight:400, borderRadius:0, overflow:'hidden', border:'1px solid var(--border)' }}>
      <div ref={containerRef} style={{ width:'100%', height:'100%', minHeight:400, filter:'grayscale(100%) brightness(1.05) contrast(0.85)' }} />
    </div>
  );
}

// ── Work Tab Nav ───────────────────────────────────────────────────────────
function WorkTabNav({ hoveredId, onHoverTab, onLeaveTab }) {
  const scrollRef = React.useRef(null);
  const [showLeft, setShowLeft] = React.useState(false);
  const [showRight, setShowRight] = React.useState(false);
  const [isMobile, setIsMobile] = React.useState(() => window.innerWidth < 640);

  const updateArrows = React.useCallback(() => {
    const el = scrollRef.current;
    if (!el) return;
    setShowLeft(el.scrollLeft > 4);
    setShowRight(el.scrollLeft + el.clientWidth < el.scrollWidth - 4);
  }, []);

  React.useEffect(() => {
    const el = scrollRef.current;
    if (el) { updateArrows(); el.addEventListener('scroll', updateArrows, { passive:true }); }
    const onResize = () => { setIsMobile(window.innerWidth < 640); updateArrows(); };
    window.addEventListener('resize', onResize);
    return () => { el && el.removeEventListener('scroll', updateArrows); window.removeEventListener('resize', onResize); };
  }, [updateArrows]);

  const scrollToItem = (id) => {
    const el = document.getElementById('work-' + id);
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  };

  const nudge = (dir) => {
    if (scrollRef.current) scrollRef.current.scrollBy({ left: dir * 160, behavior:'smooth' });
  };

  if (isMobile) {
    return (
      <div style={{ position:'sticky', top:0, zIndex:50, background:'var(--bg)', borderBottom:'1px solid var(--border)', marginBottom:32, marginLeft:-16, marginRight:-16, paddingLeft:16, paddingRight:16, paddingTop:10, paddingBottom:10 }}>
        <div style={{ position:'relative' }}>
          <select onChange={e => scrollToItem(e.target.value)} defaultValue=""
            style={{ width:'100%', fontSize:14, fontFamily:'inherit', fontWeight:500, padding:'10px 40px 10px 14px', borderRadius:0, border:'1px solid var(--border)', background:'var(--bg)', color:'var(--ink)', cursor:'pointer', appearance:'none', WebkitAppearance:'none', outline:'none' }}>
            <option value="" disabled>Jump to section…</option>
            {WORK.map((item) => {
              const id = item.title.toLowerCase().replace(/[\s&]+/g, '-');
              return <option key={id} value={id}>{item.title}</option>;
            })}
          </select>
          <span style={{ position:'absolute', right:14, top:'50%', transform:'translateY(-50%)', pointerEvents:'none', color:'var(--ink3)', fontSize:12 }}>▾</span>
        </div>
      </div>
    );
  }

  return (
    <div style={{ position:'sticky', top:0, zIndex:50, background:'var(--bg)', borderBottom:'1px solid var(--border)', marginBottom:32, marginLeft:-32, marginRight:-32 }}>
      <div style={{ position:'relative', display:'flex', alignItems:'center' }}>
        {showLeft && (
          <button onClick={() => nudge(-1)} style={{ position:'absolute', left:24, zIndex:2, top:'50%', transform:'translateY(-50%)', width:28, height:28, borderRadius:0, border:'1px solid var(--border)', cursor:'pointer', background:'var(--bg)', color:'var(--ink)', fontSize:14, display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 2px 8px oklch(0% 0 0/0.1)', flexShrink:0 }}>‹</button>
        )}
        <div ref={scrollRef} style={{ display:'flex', gap:2, overflowX:'auto', scrollbarWidth:'none', paddingTop:10, paddingBottom:10, paddingLeft: showLeft ? 64 : 32, paddingRight: showRight ? 64 : 32, flex:1 }}>
          {WORK.map((item) => {
            const id = item.title.toLowerCase().replace(/[\s&]+/g, '-');
            const isHovered = hoveredId === id;
            return (
              <button key={id} onClick={() => scrollToItem(id)}
                onMouseEnter={() => onHoverTab(id)} onMouseLeave={() => onLeaveTab()}
                style={{
                  fontFamily:'var(--mono)', fontSize:11, letterSpacing:'.05em', whiteSpace:'nowrap',
                  padding:'5px 14px', borderRadius:0, cursor:'pointer', transition:'all .2s',
                  border: isHovered ? 'none' : '1px solid transparent',
                  background: isHovered ? 'var(--accent)' : 'transparent',
                  color: isHovered ? 'white' : 'var(--ink3)',
                }}
              >
                {item.title}
              </button>
            );
          })}
        </div>
        {showRight && (
          <button onClick={() => nudge(1)} style={{ position:'absolute', right:24, zIndex:2, top:'50%', transform:'translateY(-50%)', width:28, height:28, borderRadius:0, border:'1px solid var(--border)', cursor:'pointer', background:'var(--bg)', color:'var(--ink)', fontSize:14, display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 2px 8px oklch(0% 0 0/0.1)', flexShrink:0 }}>›</button>
        )}
      </div>
    </div>
  );
}

// ── Search ────────────────────────────────────────────────────────────────
function buildSearchIndex() {
  const entries = [];
  EXP.forEach(e => {
    const subKeywords = (e.subroles||[]).flatMap(sr => [sr.role, sr.co, sr.tags||'', ...(sr.points||[])]);
    entries.push({
      page: 'experience',
      section: 'Experience',
      title: e.subroles ? e.role : `${e.role} · ${e.co}`,
      snippet: e.desc || (e.subroles ? e.subroles.map(sr => sr.co).join(', ') : ''),
      keywords: [e.role, e.co||'', e.desc||'', ...(e.points||[]), e.tags||'', ...subKeywords].join(' ').toLowerCase(),
    });
  });
  WORK.forEach(w => {
    entries.push({
      page: 'work',
      section: 'Work · ' + w.title,
      title: w.title,
      snippet: w.desc,
      keywords: [w.title, w.desc, ...(w.companies||[])].join(' ').toLowerCase(),
    });
    (w.detail?.projects||[]).forEach(p => {
      entries.push({
        page: 'work',
        section: 'Work · ' + w.title,
        title: p.name,
        snippet: p.desc,

      });
    });

      section: 'Kind words',

      snippet: t.text.slice(0, 120) + '…',
      keywords: [t.name, t.role, t.text, ...(t.tags||[]), 'recommendation review testimonial kind words'].join(' ').toLowerCase(),
    });
  });
  WRITING.forEach(w => {
    entries.push({
      page: 'writing',
      section: 'Writing · ' + w.category,
      title: w.title,
      snippet: w.excerpt,
      keywords: [w.title, w.excerpt, w.category, 'article blog medium writing'].join(' ').toLowerCase(),
    });
  });
  return entries;
}

// ── IntroOverlay ─────────────────────────────────────────────────────────
function IntroOverlay({ onDone }) {
  const bgRef   = React.useRef(null);
  const wordRef = React.useRef(null);

  React.useEffect(() => {
    const bg   = bgRef.current;
    const word = wordRef.current;
    if (!bg || !word) return;
    const timers = [];
    const T = (fn, ms) => timers.push(setTimeout(fn, ms));

    // Phase 1: Welcome scales in
    T(() => {
      word.style.transition = 'transform 0.45s cubic-bezier(0.16,1,0.3,1), opacity 0.4s ease';
      word.style.transform  = 'translate(-50%, -50%) scale(1)';
      word.style.opacity    = '1';
    }, 80);

    // Phase 2: blue brightens to white + Welcome travels to heading
    T(() => {
      bg.style.transition = 'opacity 1.0s ease-in-out';
      bg.style.opacity    = '0';

      const target = document.querySelector('[data-intro-target]');
      if (target) {
        const wRect = target.getBoundingClientRect();
        const sRect = word.getBoundingClientRect();
        const dx    = (wRect.left + wRect.width  / 2) - (sRect.left + sRect.width  / 2);
        const dy    = (wRect.top  + wRect.height / 2) - (sRect.top  + sRect.height / 2);
        const scale = wRect.width / sRect.width;
        word.style.transition = 'transform 0.9s cubic-bezier(0.76,0,0.24,1), opacity 0.25s ease 0.7s';
        word.style.transform  = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${scale})`;
      }
      word.style.opacity = '0';
    }, 950);

    T(onDone, 1750);
    return () => timers.forEach(clearTimeout);
  }, []);

  return (
    <>
      <div ref={bgRef} style={{
        position:'fixed', inset:0, background:'var(--accent)',
        zIndex:200, pointerEvents:'none',
      }} />
      <div ref={wordRef} style={{
        position:'fixed', top:'50%', left:'50%',
        transform:'translate(-50%, -50%) scale(0.88)',
        fontFamily:'var(--display)', fontSize:'clamp(90px, 18vw, 240px)',
        fontWeight:900, letterSpacing:'-0.01em', lineHeight:1,
        color:'#ffffff', whiteSpace:'nowrap',
        zIndex:201, pointerEvents:'none', opacity:0,
        willChange:'transform, opacity',
      }}>Welcome</div>
    </>
  );
}

// ── StaggerChildren ──────────────────────────────────────────────────────
// Animates direct children (or grandchildren if single wrapper div) in sequence
function StaggerChildren({ children, startDelay = 0, skip = false }) {
  const ref = React.useRef(null);
  React.useLayoutEffect(() => {
    if (skip || !ref.current) return;
    const direct = Array.from(ref.current.children);
    // If the page returns a single wrapper div, animate its children; otherwise animate direct children
    const items = (direct.length === 1 && direct[0].tagName === 'DIV')
      ? Array.from(direct[0].children)
      : direct;
    // Set hidden before paint
    items.forEach(item => {
      item.style.opacity = '0';
      item.style.transform = 'translateY(20px)';
    });
    // Stagger reveal
    const timers = items.map((item, i) =>
      setTimeout(() => {
        item.style.transition = 'opacity 0.52s cubic-bezier(0.16,1,0.3,1), transform 0.52s cubic-bezier(0.16,1,0.3,1)';
        item.style.opacity = '1';
        item.style.transform = 'translateY(0)';
      }, startDelay + i * 115)
    );
    return () => timers.forEach(clearTimeout);
  }, []);
  return <div className="page-enter" ref={ref}>{children}</div>;
}

// ── Theme ────────────────────────────────────────────────────────────────
function useTheme() {
  const [theme, setTheme] = React.useState(() => {
    return localStorage.getItem('theme') || 'light';
  });
  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
  }, [theme]);
  const toggle = () => setTheme(t => t === 'dark' ? 'light' : 'dark');
  return { theme, toggle };
}

// ── CustomCursor ─────────────────────────────────────────────────────────
function CustomCursor() {
  const [pos, setPos] = useState({ x: -999, y: -999 });
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    const onMove = (e) => { setPos({ x: e.clientX, y: e.clientY }); setVisible(true); };
    const onLeave = () => setVisible(false);
    const onEnter = () => setVisible(true);
    window.addEventListener('mousemove', onMove);
    document.documentElement.addEventListener('mouseleave', onLeave);
    document.documentElement.addEventListener('mouseenter', onEnter);
    return () => {
      window.removeEventListener('mousemove', onMove);
      document.documentElement.removeEventListener('mouseleave', onLeave);
      document.documentElement.removeEventListener('mouseenter', onEnter);
    };
  }, []);

  if (!visible) return null;

  const line = { position:'fixed', background:'var(--cursor-line)', opacity:0.6, pointerEvents:'none', zIndex:9998 };

  return (
    <>
      <div style={{ ...line, top:pos.y, left:0, width:'100vw', height:1 }} />
      <div style={{ ...line, left:pos.x, top:0, width:1, height:'100vh' }} />
      <div style={{
        position:'fixed', pointerEvents:'none', zIndex:9999,
        left:pos.x, top:pos.y, transform:'translate(-50%,-50%)',
        color:'var(--accent)', fontSize:16, fontWeight:700, lineHeight:1, userSelect:'none',
      }}>+</div>
    </>
  );
}
